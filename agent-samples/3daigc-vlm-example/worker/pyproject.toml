[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3daigc-vlm-example-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "xr-ai-agent",
    "xr-ai-logging",
    "xr-ai-models",
    "xr-ai-pipecat",
    "xr-ai-voicegate",
    "numpy>=1.24",
    "Pillow>=10.0",
    "pyyaml>=6.0",
    "fastmcp>=0.4",
    "pipecat-ai>=1.3.0",
]

# Spark/aarch64 + Python 3.12: pipecat → resampy pins ancient numba/llvmlite (<3.10).
[tool.uv]
override-dependencies = [
    "numba>=0.60",
    "llvmlite>=0.43",
]

[tool.uv.sources]
xr-ai-agent     = { path = "../../../agent-sdk", editable = true }
xr-ai-logging   = { path = "../../../utils/xr-ai-logging", editable = true }
xr-ai-models    = { path = "../../../agent-sdk/xr-ai-models", editable = true }
xr-ai-pipecat   = { path = "../../../agent-sdk/xr-ai-pipecat", editable = true }
xr-ai-voicegate = { path = "../../../utils/xr-ai-voicegate", editable = true }

[project.scripts]
daigc_vlm_example_worker = "daigc_vlm_example_worker:run"

[tool.hatch.build.targets.wheel]
only-include = [
    "daigc_vlm_example_worker.py",
    "agent.py",
    "config.py",
    "daigc_tools.py",
    "pixels.py",
    "vlm_brain_base.py",
]
