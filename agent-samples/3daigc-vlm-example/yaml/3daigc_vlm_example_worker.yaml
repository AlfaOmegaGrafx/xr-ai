# 3daigc-vlm-example worker — voice VLM + 3DAIGC mesh generation via HTTP MCP.
# Auto-discovered by the launcher and passed as --config to the worker process.

# Model deployment profile, resolved relative to this file. Hosted NIM is the
# Spark default (no local Cosmos weights). models.local.json starts STT, VLM,
# and TTS; models.omni.json reuses Nemotron-Omni on port 8108.
models_config: models.hosted.json

# Path to the voice-gate config (resolved relative to this file's
# directory). Owns the magic-phrase / follow-up / listening-chime knobs.
voice_gate_yaml: voice_gate.yaml

# The worker uses its packaged prompts/system.txt by default. Set
# system_prompt or system_prompt_file here only to override it.

# 3DAIGC HTTP MCP (must be running before the worker becomes ready).
daigc_mcp_url: http://localhost:8260
# Optional model preference for image_to_textured_mesh (e.g. trellis2).
# daigc_mesh_model: trellis2
daigc_job_timeout_sec: 600

# Frame freshness — tune if the agent sees stale frames.
frame_max_age_s: 5.0   # frame older than this is considered stale
frame_timeout_s: 30.0  # wait for a headset camera frame before giving up

# Voice Activity Detection — Silero VAD (ONNX backend).
silero_threshold:  0.5
silence_duration:  0.4
min_speech:        0.1

# Auto-cancel after this many seconds with no user/bot speech. 0 = off.
idle_timeout_secs: 0
