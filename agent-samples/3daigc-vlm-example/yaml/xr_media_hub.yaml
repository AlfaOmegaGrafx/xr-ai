# XR Media Hub configuration for 3daigc-vlm-example.
# Paths are relative to this file's directory.
# See services/xr-media-hub/xr_media_hub.yaml for all available options.

# ── LiveKit server ────────────────────────────────────────────────────────────
# Development-only placeholders. Replace both values outside local samples.
api_key:    devkey
api_secret: devsecret-xr-livekit-prototype-2026
room_name:  xr-room

lk_port_ws:  7880
lk_port_tcp: 7881
lk_port_udp: 7882

# ── Web client server ─────────────────────────────────────────────────────────
enable_web_server: true
# Spark default 8080 is often taken by openshell-gateway / docker-proxy.
web_server_port:   8088
web_client_dir:    ../../../client-samples/web

# ── Optional: token server ────────────────────────────────────────────────────
enable_token_server: true
